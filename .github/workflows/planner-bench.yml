name: planner-bench

on:
  push:
    paths:
      - "*"
      - "src/**"
      - "tests/**"
      - "e2e/**"
      - "scripts/**"
      - "qa/**"
      - "docs/**"
      - "public/**"
      - ".impeccable/**"
      - ".gitignore"
      - ".npmrc"
      - ".env.example"
      - "stryker.config.mjs"
      - ".github/workflows/planner-bench.yml"
      - "!**/*.md"
      - "!docs/**"
  pull_request:
    paths:
      - "*"
      - "src/**"
      - "tests/**"
      - "e2e/**"
      - "scripts/**"
      - "qa/**"
      - "docs/**"
      - "public/**"
      - ".impeccable/**"
      - ".gitignore"
      - ".npmrc"
      - ".env.example"
      - "stryker.config.mjs"
      - ".github/workflows/planner-bench.yml"
      - "!**/*.md"
      - "!docs/**"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 9.15.9

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.2.3
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Fetch layout-content-view
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: p10ns11y/plugins
          ref: 31d93a0355838d8b24511966ae1ba0062c05f012
          sparse-checkout: layout-content-view
          path: lcv-plugin
          persist-credentials: false

      - name: Verify
        run: pnpm verify --skip-mutation
        env:
          CI: "true"
          LCV_ROOT: ${{ github.workspace }}/lcv-plugin/layout-content-view
          PROPOSALES_MODE: fixture
          PROPOSALES_API_KEY: ""
          XAI_API_KEY: ""

      - name: Upload layout findings
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lcv-findings
          path: e2e/lcv-out/
          if-no-files-found: error
